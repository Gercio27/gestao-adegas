<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/layout :: head('Nova saída de contentor')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h3 class="mb-1">Nova saída de contentor</h3>
    <p class="text-muted">Dá baixa de garrafas ou de unidades de bag-in-box de um contentor, por um motivo. Para entrega a cliente, use a Fase 10 (Comercial).</p>

    <div class="card shadow-sm"><div class="card-body">
        <form th:action="@{/processos/saida-contentor}" th:object="${saida}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">

            <div class="col-12">
                <label class="form-label">Sai de *</label>
                <div>
                    <div class="form-check form-check-inline" th:each="t : ${tiposEmbalagem}">
                        <input class="form-check-input" type="radio" th:field="*{tipoEmbalagem}" th:value="${t}"
                               th:id="'sc-tipo-' + ${t}" onchange="alternarTipo()">
                        <label class="form-check-label" th:for="'sc-tipo-' + ${t}"
                               th:text="${t == T(pt.acv.adega.fichas.TipoEmbalagem).GARRAFA} ? 'Contentor de garrafas' : 'Palete de bag-in-box'"></label>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <label class="form-label">Contentor *</label>
                <select class="form-select" th:field="*{contentorId}" id="sc-contentor" required>
                    <option value="">—</option>
                </select>
                <div class="form-text" id="sc-ajuda"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label"><span id="lblQtd">Garrafas</span> a sair *</label>
                <input type="number" min="1" class="form-control" th:field="*{quantidade}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Motivo *</label>
                <select class="form-select" th:field="*{motivo}" id="sc-motivo" onchange="toggleObs()">
                    <option th:each="m : ${motivos}" th:value="${m}" th:text="${m.descricao}"></option>
                </select>
            </div>
            <div class="col-md-8" id="grpObs">
                <label class="form-label">Observação (obrigatória se "Outras")</label>
                <input type="text" class="form-control" th:field="*{observacao}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Data</label>
                <input type="datetime-local" class="form-control" th:field="*{dataSaida}">
            </div>

            <div class="col-12">
                <button class="btn text-white" style="background-color:#6b1f2a;" type="submit">Registar saída</button>
                <a th:href="@{/processos/saida-contentor}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div></div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    const contentoresPorTipo = /*[[${contentoresPorTipo}]]*/ {};
    const contentorGuardado = /*[[${saida.contentorId}]]*/ null;

    function toggleObs() {
        const outras = document.getElementById('sc-motivo').value === 'OUTRAS';
        document.getElementById('grpObs').style.display = outras ? '' : '';
        // observação é sempre visível; apenas realçamos quando é Outras
    }

    function tipoEscolhido() {
        const r = document.querySelector('[name="tipoEmbalagem"]:checked');
        return r ? r.value : 'GARRAFA';
    }

    /** Mostra só os contentores do tipo escolhido. */
    function alternarTipo() {
        const tipo = tipoEscolhido();
        const bib = tipo === 'BAG_IN_BOX';
        const lista = contentoresPorTipo[tipo] || [];
        const sel = document.getElementById('sc-contentor');
        let h = '<option value="">—</option>';
        lista.forEach(function (c) { h += '<option value="' + c.id + '">' + c.label + '</option>'; });
        sel.innerHTML = h;
        if (contentorGuardado) sel.value = contentorGuardado;
        document.getElementById('lblQtd').textContent = bib ? 'Unidades' : 'Garrafas';
        document.getElementById('sc-ajuda').textContent = lista.length
            ? '' : (bib ? 'Não há paletes de bag-in-box com unidades.' : 'Não há contentores com garrafas.');
    }

    document.addEventListener('DOMContentLoaded', function () {
        toggleObs();
        alternarTipo();
    });
</script>
</body>
</html>
