<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/layout :: head('Comercial')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h3 class="mb-1" th:text="${comercial.id == null} ? 'Nova entrega ao comercial' : 'Editar entrega'">Comercial</h3>
    <p class="text-muted">Fase 8. Ao <strong>fechar</strong>, dá baixa das garrafas disponíveis e emite a Nota de Entrega.</p>

    <div class="card shadow-sm"><div class="card-body">
        <form th:action="@{/processos/comercial}" th:object="${comercial}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{codigo}">

            <div class="col-md-3" th:if="${comercial.codigo != null}">
                <label class="form-label">Código</label>
                <input class="form-control" th:value="*{codigo}" disabled>
            </div>
            <div class="col-12">
                <label class="form-label">Entregar *</label>
                <div>
                    <div class="form-check form-check-inline" th:each="t : ${tiposEmbalagem}">
                        <input class="form-check-input" type="radio" th:field="*{tipoEmbalagem}" th:value="${t}"
                               th:id="'co-tipo-' + ${t}" onchange="alternarTipo()">
                        <label class="form-check-label" th:for="'co-tipo-' + ${t}" th:text="${t.descricao}"></label>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Adega / armazém *</label>
                <select class="form-select" id="co-local" onchange="popularVinhos()">
                    <option value="">— escolher local —</option>
                </select>
                <div class="form-text" id="co-ajuda"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Vinho *</label>
                <select class="form-select" id="co-vinho" onchange="popularContentores()">
                    <option value="">— escolher vinho —</option>
                </select>
                <div class="form-text">Só vinhos rotulados com stock nesse local.</div>
            </div>
            <div class="col-md-4">
                <label class="form-label"><span id="lblOrigem">De que stock sai</span> *</label>
                <select class="form-select" id="co-contentor" onchange="guardarOrigem()"
                        th:attr="data-sel=${comercial.stockRotuladoId != null ? comercial.stockRotuladoId : comercial.contentorId}"
                        required>
                    <option value="">—</option>
                </select>
                <!-- Garrafas saem do stock rotulado (caixas); bag-in-box sai da palete. -->
                <input type="hidden" th:field="*{stockRotuladoId}" id="co-stock">
                <input type="hidden" th:field="*{contentorId}" id="co-cont-id">
            </div>
            <div class="col-md-4">
                <label class="form-label"><span id="lblQtd">Garrafas</span> a entregar *</label>
                <input type="number" min="1" class="form-control" th:field="*{quantidadeGarrafas}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Destinatário (cliente)</label>
                <input type="text" class="form-control" th:field="*{destinatario}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Morada de destino</label>
                <input type="text" class="form-control" th:field="*{moradaDestino}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Responsável pela receção (quem assina a nota)</label>
                <input type="text" class="form-control" th:field="*{responsavelRececao}" placeholder="Nome de quem recebe a entrega">
            </div>

            <div class="col-md-4">
                <label class="form-label">Responsável (expedidor)</label>
                <select class="form-select" th:field="*{responsavel}">
                    <option th:value="${null}">—</option>
                    <option th:each="t : ${trabalhadores}" th:value="${t.id}" th:text="${t.nome}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Início</label>
                <input type="datetime-local" class="form-control" th:field="*{dataHoraInicio}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Meios / métodos</label>
                <input type="text" class="form-control" th:field="*{meios}">
            </div>
            <div class="col-12">
                <label class="form-label">Observações</label>
                <textarea class="form-control" th:field="*{observacoes}" rows="2"></textarea>
            </div>

            <div class="col-12">
                <button class="btn text-white" style="background-color:#6b1f2a;" type="submit">Guardar</button>
                <a th:href="@{/processos/comercial}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div></div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    const porTipoLocalEVinho = /*[[${porTipoLocalEVinho}]]*/ {};
    const locaisPorTipo = /*[[${locaisPorTipo}]]*/ {};
    const contentorGuardado = /*[[${comercial.contentorId}]]*/ null;

    function tipoEscolhido() {
        const r = document.querySelector('[name="tipoEmbalagem"]:checked');
        return r ? r.value : 'GARRAFA';
    }

    /** Tipo de embalagem escolhido -> locais que tem esse tipo rotulado. */
    function alternarTipo() {
        const tipo = tipoEscolhido();
        const bib = tipo === 'BAG_IN_BOX';
        const locais = locaisPorTipo[tipo] || [];
        const sel = document.getElementById('co-local');
        const anterior = sel.value;
        let h = '<option value="">— escolher local —</option>';
        locais.forEach(function (l) { h += '<option value="' + l.ref + '">' + l.nome + '</option>'; });
        sel.innerHTML = h;
        if (anterior) sel.value = anterior;
        if (!sel.value && locais.length === 1) sel.value = locais[0].ref;
        document.getElementById('lblQtd').textContent = bib ? 'Unidades' : 'Garrafas';
        document.getElementById('co-ajuda').textContent = locais.length ? ''
            : (bib ? 'Não há bag-in-box rotulado disponível. Faça a rotulagem (Fase 7).'
                   : 'Não há garrafas rotuladas disponíveis. Faça a rotulagem (Fase 7).');
        popularVinhos();
    }

    /** Local -> vinhos rotulados com stock nesse local. */
    function popularVinhos() {
        const local = document.getElementById('co-local').value;
        const porVinho = (porTipoLocalEVinho[tipoEscolhido()] || {})[local] || {};
        const nomes = Object.keys(porVinho);
        const sel = document.getElementById('co-vinho');
        const anterior = sel.value;
        let h = '<option value="">— escolher vinho —</option>';
        nomes.forEach(function (n) { h += '<option value="' + n + '">' + n + '</option>'; });
        sel.innerHTML = h;
        if (anterior) sel.value = anterior;
        if (!sel.value && nomes.length === 1) sel.value = nomes[0];
        popularContentores();
    }

    /** Vinho -> contentores desse vinho, nesse local. */
    function popularContentores() {
        const local = document.getElementById('co-local').value;
        const vinho = document.getElementById('co-vinho').value;
        const lista = ((porTipoLocalEVinho[tipoEscolhido()] || {})[local] || {})[vinho] || [];
        const sel = document.getElementById('co-contentor');
        const guardado = sel.dataset.sel || '';
        let h = '<option value="">—</option>';
        lista.forEach(function (c) { h += '<option value="' + c.id + '">' + c.label + '</option>'; });
        sel.innerHTML = h;
        if (guardado) sel.value = guardado;
        else if (lista.length === 1) sel.value = lista[0].id;
        guardarOrigem();
    }

    /** Manda o id escolhido para o campo certo, conforme a embalagem. */
    function guardarOrigem() {
        const bib = tipoEscolhido() === 'BAG_IN_BOX';
        const v = document.getElementById('co-contentor').value;
        document.getElementById('co-stock').value = bib ? '' : v;
        document.getElementById('co-cont-id').value = bib ? v : '';
        document.getElementById('lblOrigem').textContent = bib ? 'De que palete sai' : 'De que stock sai';
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Ao editar, encontra onde esta o contentor guardado e repoe a cadeia.
        if (contentorGuardado) {
            const t = porTipoLocalEVinho[tipoEscolhido()] || {};
            Object.keys(t).forEach(function (ref) {
                Object.keys(t[ref]).forEach(function (nome) {
                    if (t[ref][nome].some(function (c) { return String(c.id) === String(contentorGuardado); })) {
                        document.getElementById('co-local').value = ref;
                        document.getElementById('co-vinho').value = nome;
                    }
                });
            });
        }
        alternarTipo();
    });
</script>
</body>
</html>
